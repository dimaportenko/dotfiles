# Kitty Configuration
# Ported from ~/Library/Application Support/com.mitchellh.ghostty/config

# --- Font ---
# ghostty: font-family = JetBrainsMono Nerd Font (+ font-style-bold/italic).
# The only Nerd Font family actually registered on this machine is the "NFM"
# (Nerd Font Mono) build; `auto` picks its Bold/Italic/Bold-Italic faces.
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        18.0

# --- Rendering ---
# ghostty: adjust-cell-width = -1
modify_font cell_width -1px
# ghostty: alpha-blending = linear-corrected
text_composition_strategy platform
macos_thicken_font 0

# --- Scrolling ---
scrollback_lines 10000
# ghostty: mouse-scroll-multiplier = precision:1,discrete:3
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 1.0

# --- Window ---
# ghostty: macos-titlebar-style = hidden
hide_window_decorations titlebar-only
window_padding_width 2
# ghostty: window-padding-balance = true
placement_strategy center
# ghostty: maximize = true -- kitty has no conf equivalent; launch with
# `kitty --start-as=maximized` (or `open -a kitty --args --start-as=maximized`).
# Fallback: open near-fullscreen on this display.
remember_window_size no
initial_window_width  1728
initial_window_height 1080
# ghostty: macos-option-as-alt = left
macos_option_as_alt left
# Confirm before closing a tab (cmd+w -> close_tab), an OS window, or quitting.
# A positive value always asks; use `-1` to skip the prompt for windows that are
# just sitting at a shell prompt, and `1 count-background` to also count
# backgrounded jobs. kitty's default is -1.
confirm_os_window_close 1

# --- Colors: Everforest Dark (medium) ---
background #2d353b
foreground #d3c6aa

cursor #d3c6aa
cursor_text_color #2d353b

selection_background #543a48
selection_foreground #d3c6aa

url_color #7fbbb3

# Normal colors
color0  #475258
color1  #e67e80
color2  #a7c080
color3  #dbbc7f
color4  #7fbbb3
color5  #d699b6
color6  #83c092
color7  #d3c6aa

# Bright colors
color8  #475258
color9  #e67e80
color10 #a7c080
color11 #dbbc7f
color12 #7fbbb3
color13 #d699b6
color14 #83c092
color15 #d3c6aa

# --- Tab bar: styled to match the tmux status line ---
# (mirrors ~/.config/tmux/everforest.conf window-status-format)
tab_bar_edge      bottom
tab_bar_style     separator
tab_separator     ""
tab_bar_align     left
tab_bar_margin_width  0.0
tab_bar_margin_height 0.0 0.0

# tmux: window-status-format " #I:#W "
tab_title_template        " {index}:{title} "
active_tab_title_template " {index}:{title} "
active_tab_font_style     bold
inactive_tab_font_style   normal

# tmux: status-style bg=#2d353b,fg=#d3c6aa
tab_bar_background      #2d353b
# tmux: window-status-current-format bg=#343f44,fg=#a7c080,bold
active_tab_background   #343f44
active_tab_foreground   #a7c080
# tmux: window-status-format fg=#7a8478 (grey0) on the bar background
inactive_tab_background #2d353b
inactive_tab_foreground #7a8478

# --- Layouts (tmux panes -> kitty splits) ---
# `splits` gives directional panes like tmux; `stack` is what prefix+z zooms into.
enabled_layouts splits,stack

# tmux: pane-border-style / pane-active-border-style
active_border_color   #a7c080
inactive_border_color #3d484d

# --- Keybindings (migrated from ~/.config/tmux/tmux.conf) ---
# tmux prefix is C-t; these now run kitty actions directly, so no prefix.

# -- Passthrough to the shell (unchanged) --
# cmd+l -> Ctrl+L (form feed)
map cmd+l send_text all \x0c
# cmd+o -> Ctrl+O
map cmd+o send_text all \x0f

# -- Panes --
# tmux: bind % split-window -h -c "#{pane_current_path}"  (side by side)
map cmd+enter       launch --location=vsplit --cwd=current
# tmux: bind " split-window -c "#{pane_current_path}"     (stacked)
map cmd+shift+enter launch --location=hsplit --cwd=current

# tmux: prefix + Arrow -> select-pane
map cmd+left  neighboring_window left
map cmd+right neighboring_window right
map cmd+up    neighboring_window top
map cmd+down  neighboring_window bottom

# tmux: prefix + Shift-Arrow -> swap-pane (focus follows the moved pane)
map cmd+shift+left  move_window left
map cmd+shift+right move_window right
map cmd+shift+up    move_window top
map cmd+shift+down  move_window bottom

# tmux: prefix + z -> zoom pane
map cmd+f toggle_layout stack
# tmux: prefix + j -> scripts/toggle-split-orientation.sh
# kitty's splits layout flips the current pair's axis natively.
map cmd+j layout_action rotate

# -- Tabs (tmux windows) --
# tmux: bind c new-window -c "#{pane_current_path}"
map cmd+t new_tab_with_cwd

# tmux: prefix + , -> rename-window
map cmd+shift+t set_tab_title

# tmux: prefix + <n> -> select-window <n>. base-index 1, and prefix 0 -> window 10.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10

# tmux: bind-key -n S-Left/S-Right swap-window -d (root table, no prefix)
map shift+left  move_tab_backward
map shift+right move_tab_forward

# -- Scrollback --
# cmd+opt+arrows -> scrollback navigation
map cmd+alt+up    scroll_page_up
map cmd+alt+down  scroll_page_down
map cmd+alt+left  scroll_home
map cmd+alt+right scroll_end
# kitty's scrollback pager (search with / inside it)
map cmd+shift+f show_scrollback
