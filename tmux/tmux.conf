set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -sg escape-time 0
set -g extended-keys on

# bind-key -T root M-\;  send-keys ' Msemicolon'


# bin tmux prefix to M-; (alt-;)
# set -g prefix M-\;
#

# bind-key -T root M-\;  send-keys ' Msemicolon'
# set -g prefix 'M-;'
# unbind C-b
# bind 'M-;' send-prefix
#
# set -g prefix 'M-;'
# unbind C-b
# bind 'M-;' send-prefix
# k

unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on


set -g status-right ' #{?client_prefix,#[reverse]<Prefix>#[noreverse] ,}"#{=21:pane_title}" %H:%M %d-%b-%y'

set -g mouse on

# open pane in current directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Swap windows left/right without changing the active window
bind-key -n S-Left swap-window -d -t -1
bind-key -n S-Right swap-window -d -t +1

# Swap panes directionally (prefix + Shift-Arrow); focus follows the moved pane
bind-key -r S-Left  swap-pane -s '{left-of}'
bind-key -r S-Right swap-pane -s '{right-of}'
bind-key -r S-Up    swap-pane -s '{up-of}'
bind-key -r S-Down  swap-pane -s '{down-of}'

# Toggle split orientation for the current pane and its sibling only
bind-key j run-shell ~/.config/tmux/scripts/toggle-split-orientation.sh

# Load theme
source-file ~/.config/tmux/everforest.conf

# tmux-resurrect keymaps
set -g @resurrect-restore 'C-p'

run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux

# Remove old restore binding if this file is sourced in an existing tmux server
unbind-key -q C-r

